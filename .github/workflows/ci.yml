name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install app dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Firebase Functions dependencies
        run: npm ci --prefix functions

      - name: Validate Expo config
        run: pnpm validate:expo

      - name: Validate Android Firebase config
        run: pnpm validate:android

      - name: TypeScript check
        run: pnpm check

      - name: Lint
        run: pnpm lint

      - name: App unit tests
        run: pnpm test

      - name: Realtime Database rules emulator tests
        run: pnpm test:rules

      - name: Firebase Functions tests
        run: pnpm test:functions

      - name: Firebase Functions syntax check
        run: node --check functions/index.js

      - name: Validate JSON and diff whitespace
        run: |
          python3 -m json.tool database.rules.json >/dev/null
          python3 -m json.tool firebase.json >/dev/null
          python3 -m json.tool firebase.emulator.json >/dev/null
          git diff --check
