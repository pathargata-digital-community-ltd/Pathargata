<!-- মার্কেট পেজ -->
<div id="page-market" class="hidden p-4 bg-gray-100 min-h-screen pb-20">
    <!-- Header -->
    <div class="flex items-center justify-between mb-3 sticky top-0 pt-safe z-30 bg-gray-100 py-2 gap-2">
        <div class="flex items-center gap-2 flex-1">
            <button onclick="switchPage('services')" class="text-gray-500 w-8 h-8 flex items-center justify-center"><i class="fa-solid fa-arrow-left text-lg"></i></button>
            <h2 class="text-xl font-bold text-gray-800 border-l-4 border-orange-500 pl-2">উপজেলা মার্কেট</h2>
        </div>
        <div class="flex gap-2">
            <button onclick="openFavoritesModal()" class="bg-white text-red-500 border border-red-200 px-3 py-2 rounded-lg text-xs font-bold shadow-sm hover:bg-red-50 transition flex items-center gap-1"><i class="fa-solid fa-heart"></i> ফেভারিট</button>
            <button onclick="toggleCreateShopModal(true)" class="bg-orange-500 text-white px-3 py-2 rounded-lg text-xs font-bold shadow-sm hover:bg-orange-600 transition flex items-center gap-1"><i class="fa-solid fa-store"></i> দোকান খুলুন</button>
        </div>
    </div>

    <!-- Search Bar -->
    <div class="relative mb-3">
        <input type="text" id="market-search-input" onkeyup="handleMarketSearch()" placeholder="পণ্য বা দোকান সার্চ করুন..." class="w-full bg-white border border-gray-200 rounded-xl pl-10 pr-4 py-2.5 text-sm shadow-sm focus:outline-none focus:border-orange-500">
        <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-3.5 text-gray-400 text-sm"></i>
    </div>

    <!-- Market Navigation Tabs -->
    <div class="flex bg-gray-200 p-1 rounded-xl mb-4 text-xs font-bold">
        <button id="tab-btn-products" onclick="switchMarketTab('products')" class="flex-1 py-2 rounded-lg bg-orange-500 text-white shadow transition flex items-center justify-center gap-1.5"><i class="fa-solid fa-bag-shopping"></i> সকল পণ্য</button>
        <button id="tab-btn-shops" onclick="switchMarketTab('shops')" class="flex-1 py-2 rounded-lg text-gray-600 hover:text-gray-900 transition flex items-center justify-center gap-1.5"><i class="fa-solid fa-store"></i> দোকানসমূহ</button>
    </div>

    <!-- Tab 1: All Products List -->
    <div id="market-products-list" class="grid grid-cols-2 gap-3">
        <p class="col-span-2 text-center text-gray-400 py-10">লোড হচ্ছে...</p>
    </div>

    <!-- Tab 2: Shops List Grid -->
    <div id="market-shops-list" class="grid grid-cols-2 gap-3 hidden">
        <p class="col-span-2 text-center text-gray-400 py-10">লোড হচ্ছে...</p>
    </div>
</div>

<!-- দোকান তৈরির মডাল -->
<div id="create-shop-modal" class="fixed inset-0 bg-black bg-opacity-70 z-[100] flex items-center justify-center hidden-custom p-4 backdrop-blur-sm">
    <div class="bg-white w-full max-w-sm rounded-xl p-5 shadow-2xl relative max-h-[90vh] overflow-y-auto">
        <button onclick="toggleCreateShopModal(false)" class="absolute top-4 right-4 text-gray-400 hover:text-red-500"><i class="fa-solid fa-xmark text-xl"></i></button>
        <h3 class="text-lg font-bold text-gray-800 mb-4 border-b pb-2 flex items-center gap-2"><i class="fa-solid fa-store text-orange-500"></i> নতুন দোকান তৈরি করুন</h3>
        
        <div class="space-y-3">
            <div>
                <label class="block text-xs font-bold text-gray-600 mb-1">দোকানের নাম *</label>
                <input type="text" id="shop-name" placeholder="উদাঃ ভাই ভাই ইলেকট্রনিক্স" class="w-full bg-gray-50 border p-2.5 rounded-lg text-sm">
            </div>
            <div>
                <label class="block text-xs font-bold text-gray-600 mb-1">ক্যাটাগরি</label>
                <input type="text" id="shop-category" placeholder="উদাঃ ইলেকট্রনিক্স, কাপড়ের দোকান, খাবার" class="w-full bg-gray-50 border p-2.5 rounded-lg text-sm">
            </div>
            <div>
                <label class="block text-xs font-bold text-gray-600 mb-1">যোগাযোগের নম্বর *</label>
                <input type="tel" id="shop-phone" placeholder="017XXXXXXXX" class="w-full bg-gray-50 border p-2.5 rounded-lg text-sm">
            </div>
            <div>
                <label class="block text-xs font-bold text-gray-600 mb-1">দোকানের ঠিকানা / লোকেশন *</label>
                <input type="text" id="shop-address" placeholder="বাজারের নাম বা লোকেশন" class="w-full bg-gray-50 border p-2.5 rounded-lg text-sm">
            </div>
            <div>
                <label class="block text-xs font-bold text-gray-600 mb-1">দোকান সম্পর্কে বিবরণ</label>
                <textarea id="shop-desc" placeholder="আপনার দোকান ও সার্ভিস সম্পর্কে কিছু লিখুন..." rows="2" class="w-full bg-gray-50 border p-2.5 rounded-lg text-sm"></textarea>
            </div>
            <div>
                <label class="block text-xs font-bold text-gray-600 mb-1">দোকানের ছবি / লোগো</label>
                <input type="file" id="shop-logo-file" accept="image/*" onchange="previewShopLogo(this)" class="w-full bg-gray-50 border p-2 rounded-lg text-sm file:mr-3 file:py-1 file:px-3 file:rounded-full file:border-0 file:text-xs file:bg-orange-50 file:text-orange-700">
                <img id="shop-logo-preview" class="w-20 h-20 rounded-lg object-cover mt-2 border hidden">
            </div>
        </div>
        <button onclick="submitCreateShop()" id="btn-shop-submit" class="w-full bg-orange-500 text-white font-bold py-3 mt-4 rounded-lg shadow hover:bg-orange-600 transition flex justify-center items-center gap-2">দোকান ওপেন করুন</button>
    </div>
</div>

<!-- Shop Details View Modal -->
<div id="shop-details-modal" class="fixed inset-0 bg-white z-[95] hidden-custom flex flex-col">
    <!-- Shop Details Top Header -->
    <div class="flex items-center justify-between p-4 border-b bg-white sticky top-0 z-20 pt-safe shadow-sm">
        <div class="flex items-center gap-2">
            <button onclick="closeShopDetails()" class="w-9 h-9 rounded-full hover:bg-gray-100 flex items-center justify-center text-gray-600"><i class="fa-solid fa-arrow-left text-lg"></i></button>
            <h3 class="font-bold text-gray-800 text-base line-clamp-1" id="shop-detail-name">দোকানের নাম</h3>
        </div>
        <div class="flex items-center gap-2">
            <button id="shop-detail-fav-btn" class="w-9 h-9 rounded-full bg-gray-50 flex items-center justify-center"></button>
            <button id="shop-add-product-btn" onclick="toggleSellModal(true)" class="hidden bg-orange-500 text-white text-xs font-bold px-3 py-2 rounded-lg flex items-center gap-1"><i class="fa-solid fa-plus"></i> পণ্য দিন</button>
        </div>
    </div>

    <!-- Shop Info & Products Content -->
    <div class="flex-1 overflow-y-auto bg-gray-50 pb-20">
        <!-- Shop Card Profile -->
        <div class="bg-white p-4 border-b">
            <div class="flex gap-4">
                <div id="shop-detail-logo" class="w-20 h-20 shrink-0"></div>
                <div class="flex-1">
                    <span id="shop-detail-cat" class="text-[10px] bg-orange-50 text-orange-600 px-2 py-0.5 rounded-full font-bold">ক্যাটাগরি</span>
                    <p class="text-xs text-gray-600 mt-1"><i class="fa-solid fa-location-dot text-red-500"></i> <span id="shop-detail-address"></span></p>
                    <p class="text-xs text-gray-600 mt-1"><i class="fa-solid fa-phone text-green-500"></i> <span id="shop-detail-phone"></span></p>
                </div>
            </div>
            <p id="shop-detail-desc" class="text-xs text-gray-500 mt-3 bg-gray-50 p-2 rounded-lg"></p>
            <a id="shop-detail-phone-btn" href="#" class="mt-3 block text-center bg-green-600 text-white font-bold py-2 rounded-lg text-xs shadow hover:bg-green-700 transition"><i class="fa-solid fa-phone"></i> দোকানে সরাসরি কল দিন</a>
        </div>

        <!-- Products List in Shop -->
        <div class="p-4">
            <h4 class="font-bold text-gray-800 text-sm mb-3 border-l-4 border-orange-500 pl-2">দোকানের পণ্যসমূহ</h4>
            <div id="shop-products-list" class="grid grid-cols-2 gap-3">
                <!-- Products dynamically loaded -->
            </div>
        </div>
    </div>
</div>

<!-- পণ্য বিক্রির মডাল (Shop এর ভেতরে পণ্য আপলোড) -->
<div id="sell-modal" class="fixed inset-0 bg-black bg-opacity-70 z-[105] flex items-center justify-center hidden-custom p-4 backdrop-blur-sm">
    <div class="bg-white w-full max-w-sm rounded-xl p-5 shadow-2xl relative">
        <button onclick="toggleSellModal(false)" class="absolute top-4 right-4 text-gray-400 hover:text-red-500"><i class="fa-solid fa-xmark text-xl"></i></button>
        <h3 class="text-lg font-bold text-gray-800 mb-4 border-b pb-2">দোকানে নতুন পণ্য যুক্ত করুন</h3>
        <div class="space-y-3">
            <input type="text" id="sell-title" placeholder="পণ্যের নাম" class="w-full bg-gray-50 border p-2.5 rounded-lg text-sm">
            <input type="number" id="sell-price" placeholder="দাম (টাকা)" class="w-full bg-gray-50 border p-2.5 rounded-lg text-sm">
            <textarea id="sell-desc" placeholder="বিবরণ এবং অন্যান্য তথ্য..." rows="3" class="w-full bg-gray-50 border p-2.5 rounded-lg text-sm"></textarea>
            <div>
                <label class="block text-xs font-bold text-gray-500 mb-1">পণ্যের ছবি (সর্বোচ্চ ৪টি)</label>
                <input type="file" id="sell-image-file" accept="image/*" multiple onchange="previewSellImages(this)" class="w-full bg-gray-50 border border-gray-200 p-2 rounded-lg text-sm file:mr-4 file:py-1 file:px-3 file:rounded-full file:border-0 file:text-xs file:bg-orange-50 file:text-orange-700">
                <div id="sell-image-preview" class="flex gap-2 mt-2 overflow-x-auto pb-2 scrollbar-hide"></div>
            </div>
        </div>
        <button onclick="submitProduct()" id="btn-sell-submit" class="w-full bg-orange-500 text-white font-bold py-3 mt-4 rounded-lg shadow hover:bg-orange-600 transition flex justify-center items-center gap-2">পণ্য যুক্ত করুন</button>
    </div>
</div>

<!-- Product Details Modal -->
<div id="product-details-modal" class="fixed inset-0 bg-black bg-opacity-70 z-[110] flex items-end sm:items-center justify-center hidden-custom p-0 sm:p-4 backdrop-blur-sm transition-transform transform translate-y-full sm:translate-y-0">
    <div class="bg-white w-full max-w-md rounded-t-2xl sm:rounded-2xl shadow-2xl overflow-hidden flex flex-col max-h-[90vh]">
        <div class="flex justify-between items-center p-4 border-b sticky top-0 bg-white z-10">
            <h3 class="text-lg font-bold text-gray-800 truncate">পণ্যের বিস্তারিত</h3>
            <button onclick="closeProductDetails()" class="w-8 h-8 rounded-full bg-gray-100 flex items-center justify-center text-gray-500 hover:bg-red-100 hover:text-red-500 transition"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <div class="overflow-y-auto pb-20 sm:pb-4 relative flex-1" id="product-details-content"></div>
    </div>
</div>

<!-- Favorites Modal -->
<div id="favorites-modal" class="fixed inset-0 bg-white z-[105] hidden-custom flex flex-col">
    <div class="flex items-center justify-between p-4 border-b bg-white shadow-sm z-10 sticky top-0 pt-safe">
        <div class="flex items-center gap-2">
            <button onclick="closeFavoritesModal()" class="w-9 h-9 rounded-full hover:bg-gray-100 flex items-center justify-center text-gray-600"><i class="fa-solid fa-arrow-left text-lg"></i></button>
            <h3 class="font-bold text-gray-800 text-lg border-l-4 border-red-500 pl-2">পছন্দের তালিকা</h3>
        </div>
    </div>
    <div class="flex-1 overflow-y-auto p-4 bg-gray-50 space-y-6 pb-20">
        <div>
            <h4 class="font-bold text-sm text-gray-700 mb-2"><i class="fa-solid fa-store text-orange-500"></i> পছন্দের দোকানসমূহ</h4>
            <div id="fav-shops-list" class="space-y-2"></div>
        </div>
        <div>
            <h4 class="font-bold text-sm text-gray-700 mb-2"><i class="fa-solid fa-box text-orange-500"></i> পছন্দের পণ্যসমূহ</h4>
            <div id="fav-products-list" class="space-y-2"></div>
        </div>
    </div>
</div>

<!-- সরাসরি অর্ডার করার মডাল -->
<div id="order-modal" class="fixed inset-0 bg-black bg-opacity-70 z-[120] flex items-center justify-center hidden-custom p-4 backdrop-blur-sm">
    <div class="bg-white w-full max-w-sm rounded-2xl p-5 shadow-2xl relative">
        <button onclick="toggleOrderModal(false)" class="absolute top-4 right-4 text-gray-400 hover:text-red-500"><i class="fa-solid fa-xmark text-xl"></i></button>
        <h3 class="text-base font-bold text-gray-800 mb-3 border-b pb-2 flex items-center gap-2 text-orange-600"><i class="fa-solid fa-truck-fast"></i> পণ্য অর্ডার কনফার্ম করুন</h3>
        
        <div class="bg-orange-50 p-2.5 rounded-xl mb-3 flex items-center gap-3">
            <img id="order-prod-img" class="w-12 h-12 rounded-lg object-cover bg-white">
            <div class="truncate">
                <h4 id="order-prod-title" class="font-bold text-xs text-gray-800 truncate"></h4>
                <p id="order-prod-price" class="text-orange-600 font-extrabold text-sm"></p>
            </div>
        </div>

        <div class="space-y-3">
            <div>
                <label class="block text-xs font-bold text-gray-600 mb-1">আপনার নাম *</label>
                <input type="text" id="order-buyer-name" placeholder="আপনার পূর্ণ নাম" class="w-full bg-gray-50 border p-2.5 rounded-lg text-xs">
            </div>
            <div>
                <label class="block text-xs font-bold text-gray-600 mb-1">মোবাইল নম্বর *</label>
                <input type="tel" id="order-buyer-phone" placeholder="017XXXXXXXX" class="w-full bg-gray-50 border p-2.5 rounded-lg text-xs">
            </div>
            <div>
                <label class="block text-xs font-bold text-gray-600 mb-1">ডেলিভারি ঠিকানা / এলাকা *</label>
                <textarea id="order-buyer-address" placeholder="গ্রাম/এলাকা, বিস্তারিত ঠিকানা..." rows="2" class="w-full bg-gray-50 border p-2.5 rounded-lg text-xs"></textarea>
            </div>
            <div>
                <label class="block text-xs font-bold text-gray-600 mb-1">পরিমাণ (Quantity)</label>
                <input type="number" id="order-quantity" value="1" min="1" class="w-full bg-gray-50 border p-2 rounded-lg text-xs">
            </div>
        </div>
        <button onclick="submitOrder()" id="btn-submit-order" class="w-full bg-orange-500 text-white font-bold py-3 mt-4 rounded-xl shadow-md hover:bg-orange-600 transition flex justify-center items-center gap-2 text-sm"><i class="fa-solid fa-check-circle"></i> অর্ডার প্লেস করুন</button>
    </div>
</div>
