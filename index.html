<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('/Pathargata/service-worker.js')
        .then((registration) => {
          console.log('Service Worker সফলভাবে রেজিস্টার হয়েছে:', registration.scope);
          // অটোমেটিক আপডেটের জন্য লিসেনার
          registration.addEventListener('updatefound', () => {
            const newWorker = registration.installing;
            newWorker.addEventListener('statechange', () => {
              if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                // নতুন আপডেট পাওয়া গেলে ক্যাশ ক্লিয়ার করে পেজ রিফ্রেশ
                caches.keys().then(names => Promise.all(names.map(name => caches.delete(name))));
                window.location.reload(true);
              }
            });
          });
        })
        .catch((error) => {
          console.error('Service Worker রেজিস্ট্রেশন ফেইল করেছে:', error);
        });
    });
  }
</script>

    <script>
        window.appErrors = [];
        function showDebuggerUI() {
            let errBtn = document.getElementById('debug-error-btn');
            if (!errBtn && document.body) {
                errBtn = document.createElement('div');
                errBtn.id = 'debug-error-btn';
                errBtn.innerHTML = '🐛'; // শুধুমাত্র পোকা আইকন
                // বাটনটি ছোট গোল করে ডানপাশে প্লাস বাটনের ঠিক উপরে বসানো হয়েছে
                errBtn.style.cssText = 'position:fixed; bottom:180px; right:35px; background:#ef4444; color:white; width:35px; height:35px; display:flex; align-items:center; justify-content:center; border-radius:50%; z-index:9999999; font-size:16px; cursor:pointer; box-shadow:0 4px 10px rgba(239,68,68,0.4); border: 2px solid white; animation: bounce 1s infinite;';

                errBtn.onclick = function() {
                    const errText = window.appErrors.map((e, i) => `[Error ${i+1}]\nমেসেজ: ${e.msg}\nফাইল: ${e.file}\nলাইন: ${e.line}`).join('\n\n------------------------\n\n');
                    alert("⚠️ অ্যাপে নিচের সমস্যাগুলো পাওয়া গেছে:\n\n" + errText);
                };
                document.body.appendChild(errBtn);
            }
        }

        // সাধারণ জাভাস্ক্রিপ্ট এরর ধরবে
        window.onerror = function(msg, url, lineNo, columnNo, error) {
            const file = url ? url.substring(url.lastIndexOf('/') + 1) : 'Unknown File';
            window.appErrors.push({msg: msg, file: file, line: lineNo});
            if(document.body) showDebuggerUI();
            else window.addEventListener('DOMContentLoaded', showDebuggerUI);
            return false;
        };

        // প্রমিস বা মডিউল ফেইলর ধরবে
        window.addEventListener('unhandledrejection', function(event) {
            const reason = event.reason ? (event.reason.stack || event.reason.toString()) : 'Unknown Promise Rejection';
            window.appErrors.push({msg: reason, file: 'Async/Module', line: '?'});
            if(document.body) showDebuggerUI();
            else window.addEventListener('DOMContentLoaded', showDebuggerUI);
        });
    </script>

                    fileToUpload = await resizeImage(file);

                    console.warn("Image resize failed, uploading original", e);
                }
            }

            const formData = new FormData();
            formData.append('file', fileToUpload);

            // 🌟 নতুন লজিক: রেগুলার পোস্ট এবং স্টোরির জন্য আলাদা ক্লাউডিনারি 🌟
            let cloudName = 'dl1auoanl'; // আপনার মেইন ক্লাউডিনারি নাম (রেগুলার পোস্টের জন্য)

        // Helper: Resize Image using Canvas
        function resizeImage(file, maxWidth = 800) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = (event) => {
                    const img = new Image();
                    img.src = event.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        let width = img.width,
                            height = img.height;
                        if (width > maxWidth) {
                            height *= maxWidth / width;
                            width = maxWidth;
                        }
                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        canvas.toBlob((blob) => {
                            if (blob) resolve(new File([blob], file.name, {
                                type: 'image/jpeg'
                            }));
                            else reject(new Error("Canvas blob error"));
                        }, 'image/jpeg', 0.7);
                    };
                    img.onerror = reject;
                };
                reader.onerror = reject;
            });
        }

                    if (entry.target.tagName === 'VIDEO') {
                        if (entry.isIntersecting) {
                            // ডাটা সেভার চেক করা হচ্ছে
                            const isDataSaver = localStorage.getItem('dataSaver') === 'true';
                            if (!isDataSaver) {
                                entry.target.play().catch(e => console.log('Autoplay blocked', e));
                            }
                        } else {
                            entry.target.pause();
                        }
                    }
                });
            }, {
                threshold: 0.5
            });

            const feedContainer = document.getElementById('news-feed');
            const mutationObserver = new MutationObserver((mutations) => {
                mutations.forEach(mutation => {
                    mutation.addedNodes.forEach(node => {
                        if (node.nodeType === 1) {
                            const videos = node.querySelectorAll('video');
                            videos.forEach(v => videoObserver.observe(v));
                            if (node.tagName === 'VIDEO') videoObserver.observe(node);
                        }
                    });
                });
            });
            mutationObserver.observe(feedContainer, {
                childList: true,
                subtree: true
            });
        }

let swipeStartX = 0;
let swipeStartY = 0;
let swipeEndX = 0;
let swipeEndY = 0;
const SWIPE_THRESHOLD = 50; // সোয়াইপ কাজ করার জন্য ন্যূনতম দূরত্ব (একটু কমিয়ে দিলাম যেন আরও স্মুথলি ধরে)

document.addEventListener('touchstart', (e) => {
    swipeStartX = e.changedTouches[0].screenX;
    swipeStartY = e.changedTouches[0].screenY;
}, { passive: true });

document.addEventListener('touchend', (e) => {
    swipeEndX = e.changedTouches[0].screenX;
    swipeEndY = e.changedTouches[0].screenY;

    // কোনো হরাইজন্টাল স্লাইডার বা মডালের ভেতরে থাকলে সোয়াইপ ইগনোর করবে
    if (e.target.closest('.overflow-x-auto') || e.target.closest('.hide-scrollbar') || e.target.closest('.fixed.z-\\[180\\], .fixed.z-\\[200\\], .fixed.z-\\[210\\], .fixed.z-\\[300\\]')) {
        return;
    }

    handleGlobalSwipe();
}, { passive: true });

// স্মুথ অ্যানিমেশন ফায়ার করার ফাংশন
function triggerSwipeAnimation(direction) {
    const mainContent = document.getElementById('content-pages');
    if (!mainContent) return;

    // পুরনো ক্লাস মুছে ফেলা
    mainContent.classList.remove('swipe-animate-next', 'swipe-animate-prev');
    void mainContent.offsetWidth; // Force CSS reflow (অ্যানিমেশন রিস্টার্ট করার ট্রিক)

    // নতুন ক্লাস যুক্ত করা
    if (direction === 'next') {
        mainContent.classList.add('swipe-animate-next');
    } else {
        mainContent.classList.add('swipe-animate-prev');
    }

    // নির্দিষ্ট সময় পর ক্লাস মুছে ফেলা যেন আবার ব্যবহার করা যায়
    setTimeout(() => {
        mainContent.classList.remove('swipe-animate-next', 'swipe-animate-prev');
    }, 300);
}

function handleGlobalSwipe() {
    const diffX = swipeStartX - swipeEndX;
    const diffY = swipeStartY - swipeEndY;

    // শর্ত: ডানে-বামে সোয়াইপের পরিমাণ যদি উপর-নিচ স্ক্রলের চেয়ে বেশি হয়
    if (Math.abs(diffX) > Math.abs(diffY) && Math.abs(diffX) > SWIPE_THRESHOLD) {

        const activeNavBtn = document.querySelector('.nav-btn.nav-active');
        if (!activeNavBtn) return;
        const currentBottomTab = activeNavBtn.id.replace('btn-', '');

        const bottomTabsOrder = ['home', 'services', 'messages', 'people', 'profile'];
        const currentBottomIndex = bottomTabsOrder.indexOf(currentBottomTab);

        if (currentBottomTab === 'home') {
            const topTabs = Array.from(document.querySelectorAll('#home-tabs .feed-tab')).filter(tab => tab.style.display !== 'none');
            const activeTopIndex = topTabs.findIndex(tab => tab.classList.contains('active'));

            if (activeTopIndex !== -1) {
                if (diffX > 0) { // বামে সোয়াইপ (পরবর্তী ট্যাব)
                    if (activeTopIndex < topTabs.length - 1) {
                        triggerSwipeAnimation('next');
                        setTimeout(() => topTabs[activeTopIndex + 1].click(), 50); // অ্যানিমেশন শুরুর একটু পর পেজ চেঞ্জ হবে
                    } else {
                        triggerSwipeAnimation('next');
                        setTimeout(() => switchPage('services'), 50);
                    }
                } else { // ডানে সোয়াইপ (আগের ট্যাব)
                    if (activeTopIndex > 0) {
                        triggerSwipeAnimation('prev');
                        setTimeout(() => topTabs[activeTopIndex - 1].click(), 50);
                    }
                }
            }
        }
        else {
            if (diffX > 0) { // বামে সোয়াইপ
                if (currentBottomIndex < bottomTabsOrder.length - 1) {
                    triggerSwipeAnimation('next');
                    setTimeout(() => switchPage(bottomTabsOrder[currentBottomIndex + 1]), 50);
                }
            } else { // ডানে সোয়াইপ
                if (currentBottomIndex > 0) {
                    const prevPage = bottomTabsOrder[currentBottomIndex - 1];
                    triggerSwipeAnimation('prev');
                    setTimeout(() => {
                        if (prevPage === 'home') {
                            handleHomeClick();
                        } else {
                            switchPage(prevPage);
                        }
                    }, 50);
                }
            }
        }
    }
}

            const commentModal = document.getElementById('comment-full-modal');

                return;
            }
            if (!document.getElementById('feeling-modal').classList.contains('hidden-custom')) {

                return;

            if (!document.getElementById('post-modal').classList.contains('hidden-custom')) {

                return;
            }
            if (!document.getElementById('emergency-modal').classList.contains('hidden-custom')) {
                document.getElementById('emergency-modal').classList.add('hidden-custom');
                return;
            }
            if (!document.getElementById('sell-modal').classList.contains('hidden-custom')) {
                document.getElementById('sell-modal').classList.add('hidden-custom');
                return;
            }
            if (!document.getElementById('edit-profile-modal').classList.contains('hidden-custom')) {
                document.getElementById('edit-profile-modal').classList.add('hidden-custom');
                return;
            }
            if (!document.getElementById('webview-modal').classList.contains('hidden-custom')) {
                closeWebview();
                return;
            }

            if (!document.getElementById('blocked-users-modal').classList.contains('hidden-custom')) {
                closeBlockedUsersModal();
                return;
            }

            // Verification modal removed in this update, handled by page

            if (document.getElementById('search-modal').classList.contains('open')) {
                toggleGlobalSearch(false);
                return;
            }
            if (!document.getElementById('tag-friends-modal').classList.contains('hidden-custom')) {
                closeTagModal();
                return;
            }
            if (!document.getElementById('feeling-modal').classList.contains('hidden-custom')) {
                closeFeelingModal();
                return;
            }
            if (!document.getElementById('single-post-modal').classList.contains('hidden-custom')) {
                document.getElementById('single-post-modal').classList.add('hidden-custom');
                return;
            }
            if (document.getElementById('image-viewer-modal').classList.contains('open')) {
                closeImageViewer();
                return;
            }

            // Handle Page Navigation History
            if (event.state?.page) {
                if (event.state.page === 'comment-modal') {
                    if (typeof window.closeFullCommentModal === 'function') {
                        window.closeFullCommentModal(true);
                    }
                } else if (event.state.page === 'chat-conversation') {
                    if (event.state.bot && window.startBotChat) {
                        window.startBotChat();
                    } else if (event.state.uid && window.startChat) {
                        const cachedUser = window.userCache ? window.userCache[event.state.uid] : null;
                        window.startChat(event.state.uid, cachedUser ? cachedUser.name : 'User');
                    }
                } else {
                    if (event.state.page === 'messages') {
                        const chatConvView = document.getElementById('chat-conversation-view');
                        if (chatConvView && !chatConvView.classList.contains('hidden') && window.closeChat) {
                            window.closeChat();
                        } else {
                            switchPage(event.state.page, false);
                        }
                    } else {
                        switchPage(event.state.page, false);
                    }
                }
            } else {

                if (currentTab !== 'home') {
                    switchPage('home', false);

        // Messages HTML Fetcher (Strict Relative Path Resolution)
        async function loadMessagesUI() {
            const container = document.getElementById('page-messages');
            // যদি ডিজাইন ইতিমধ্যে লোড হয়ে থাকে তবে পুনরায় ফেচ করার প্রয়োজন নেই
            if (container && container.querySelector('#chat-list-view')) {
                return Promise.resolve();
            }
            try {
                // WebView-এর জন্য অত্যন্ত সুরক্ষিত ও সরাসরি পাথ মেথড
                let response = await fetch('messages-ui.html');
                if (!response.ok) {
                    response = await fetch('./messages-ui.html'); // Fallback পাথ
                }
                if (!response.ok) throw new Error('Failed to load Messages UI');

                const htmlText = await response.text();
                if (container) {
                    container.innerHTML = htmlText;
                    console.log("Messages Design Loaded Successfully!");
                }
                return Promise.resolve();
            } catch (error) {
                console.error("Error loading Messages UI:", error);
                return Promise.reject(error);
            }
        }
        window.loadMessagesUI = loadMessagesUI;

    <!-- অফলাইন চেকার স্ক্রিপ্ট -->
    <script>
        function handleOfflineUI() {
            // চেক করুন ইন্টারনেট আছে কিনা বা Tailwind লোড হয়েছে কিনা
            const isOffline = !navigator.onLine;
            const isTailwindLoaded = typeof tailwind !== 'undefined';

            if (isOffline || !isTailwindLoaded) {
                // ইন্টারনেট না থাকলে মূল বডির সব কিছু লুকিয়ে অফলাইন স্ক্রিন দেখাবে
                const children = document.getElementById('body-main').children;
                for (let i = 0; i < children.length; i++) {
                    if (children[i].id !== 'offline-screen' && children[i].tagName !== 'SCRIPT' && children[i].tagName !== 'STYLE') {
                        children[i].style.display = 'none';
                    }
                }
                document.getElementById('offline-screen').style.display = 'flex';
            }
        }

        // পেজ লোড হওয়ার পর চেক করবে
        window.addEventListener('load', () => {
            setTimeout(handleOfflineUI, 1000); // Tailwind লোড হওয়ার জন্য ১ সেকেন্ড সময় দেওয়া হলো
        });

        // ইন্টারনেট চলে গেলে সাথে সাথে অফলাইন স্ক্রিন দেখাবে
        window.addEventListener('offline', handleOfflineUI);

        // ইন্টারনেট আসলে পেজ রিলোড করে ঠিক করে নিবে
        window.addEventListener('online', () => {
            window.location.reload();
        });
    </script>
