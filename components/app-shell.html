    <!-- ৫. মেইন অ্যাপ কন্টেইনার -->
    <div class="app-container hidden-custom" id="main-app">

                <button type="button" onclick="toggleSidebar(true)" class="w-10 h-10 rounded-full bg-gray-50 flex items-center justify-center hover:bg-gray-200 transition"><i class="fa-solid fa-bars text-xl"></i></button>

            </div>
            <div class="flex items-center gap-3">

                <div onclick="switchPage('notifications')" class="cursor-pointer relative">

            </div>

        <main id="content-pages">

            <!-- হোম পেজ শুরু -->
            <div id="page-home" class="p-0 animate-fade">

                <!-- 1. Tabs Section -->
                <div id="home-tabs" class="bg-white border-b sticky top-[68px] z-30 transition-all duration-300">
                    <div class="flex overflow-x-auto hide-scrollbar">
                        <div onclick="filterFeed('all')" id="tab-feed-all" class="min-w-[80px] flex-1 text-center py-3.5 text-xs font-bold text-gray-500 cursor-pointer feed-tab active uppercase">উপজেলা</div>
                        <div onclick="filterFeed('union')" id="tab-feed-union" class="min-w-[80px] flex-1 text-center py-3.5 text-xs font-bold text-gray-500 cursor-pointer feed-tab uppercase">ইউনিয়ন</div>
                        <div onclick="filterFeed('village')" id="tab-feed-village" class="min-w-[80px] flex-1 text-center py-3.5 text-xs font-bold text-gray-500 cursor-pointer feed-tab uppercase" style="display: none;">গ্রাম</div>
                        <div onclick="handleFeedFilterClick('contest')" id="tab-feed-contest" class="min-w-[90px] flex-1 text-center py-3.5 text-xs font-bold text-transparent bg-clip-text bg-gradient-to-r from-purple-600 to-pink-500 cursor-pointer feed-tab uppercase">প্রতিযোগিতা</div>
                        <!-- নতুন ফিফা ট্যাব -->
                        <div onclick="handleFeedFilterClick('fifa')" id="tab-feed-fifa" class="min-w-[80px] flex-1 text-center py-3.5 text-xs font-bold text-green-600 cursor-pointer feed-tab uppercase flex items-center justify-center gap-1"><i class="fa-solid fa-futbol"></i> ফিফা</div>
                    </div>
                </div>

                <!-- New Post Alert Button -->
                <div id="new-post-alert" onclick="refreshFeed()" class="hidden fixed top-24 left-1/2 transform -translate-x-1/2 bg-blue-600 text-white px-4 py-1.5 rounded-full shadow-lg z-40 text-sm font-bold cursor-pointer transition-transform duration-300 hover:bg-blue-700 animate-bounce">
                    <i class="fa-solid fa-arrow-up mr-1"></i> নতুন পোস্ট এসেছে
                </div>

                <!-- 2. Regular Feed Section (নোটস এবং সাধারণ পোস্ট) -->
                <div id="regular-feed-section" class="bg-gray-100 pb-20">
                    <div id="notes-ui-container"></div>

                    <div id="news-feed" class="px-0 space-y-3 min-h-[300px] mt-2">
                        <!-- Initial Loader Skeleton -->
                        <div class="flex flex-col gap-3 p-4" id="initial-feed-skeleton">
                            <div class="h-40 w-full skeleton"></div>
                            <div class="h-40 w-full skeleton"></div>
                        </div>
                    </div>

                    <!-- Pagination / Load More Controls -->
                    <div id="feed-loader-area" class="pb-10 pt-2 text-center hidden">
                        <button type="button" id="btn-load-more" onclick="loadMorePosts()" class="btn-load-more hidden"><i class="fa-solid fa-arrow-down"></i> আরো দেখুন</button>
                        <div id="loader-spinner" class="py-4"><i class="fa-solid fa-circle-notch fa-spin text-green-600 text-2xl"></i></div>
                        <div id="scroll-sentinel" style="height: 10px; width: 100%;"></div>
                    </div>
                </div>

                <div id="contest-ui-container" class="hidden-custom"></div>
                <!-- নতুন ফিফা কন্টেইনার -->
                <div id="fifa-ui-container" class="hidden-custom bg-gray-100 min-h-screen pb-20"></div>
              </div>
            <!-- SERVICE_DASHBOARD_SLOT -->
            <!-- NEW INVITE & UPDATE PAGE -->
            <div id="page-invite" class="hidden p-0 min-h-screen bg-gray-50 pb-20">
                <div class="bg-white p-4 sticky top-0 z-30 shadow-sm border-b pt-safe flex items-center gap-2">
                    <button type="button" onclick="switchPage('home')" class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-gray-100 text-gray-600"><i class="fa-solid fa-arrow-left text-lg"></i></button>
                    <h2 class="text-xl font-bold text-gray-800">অ্যাপ শেয়ার ও আপডেট</h2>
                </div>

                <div class="p-6 flex flex-col items-center justify-center mt-6 space-y-6">
                    <div class="w-28 h-28 bg-pink-100 text-pink-600 rounded-full flex items-center justify-center text-5xl shadow-md logo-animate border-4 border-white">
                        <i class="fa-solid fa-share-nodes"></i>
                    </div>
                    <div class="text-center">
                        <h3 class="text-2xl font-bold text-gray-800">পাথরঘাটা ডিজিটাল</h3>
                        <p class="text-gray-500 mt-2 text-sm">অ্যাপটি বন্ধুদের সাথে শেয়ার করুন অথবা নতুন ভার্সন আপডেট করতে ওয়েবসাইটে যান।</p>
                    </div>

                    <div class="w-full space-y-4 max-w-sm mt-8">
                        <!-- Option 1: Copy/Share Link -->
                        <button type="button" onclick="actionShareInvite()" class="w-full bg-blue-600 text-white font-bold py-4 rounded-xl shadow-lg hover:bg-blue-700 transition flex items-center justify-center gap-3 text-base active:scale-95">
                            <i class="fa-solid fa-copy text-xl"></i> লিংক কপি ও শেয়ার করুন
                        </button>

                        <!-- Option 2: Go to Website / Update App -->
                        <button type="button" onclick="actionUpdateApp()" class="w-full bg-green-600 text-white font-bold py-4 rounded-xl shadow-lg hover:bg-green-700 transition flex items-center justify-center gap-3 text-base active:scale-95">
                            <i class="fa-solid fa-globe text-xl"></i> ওয়েবসাইটে যান / আপডেট করুন
                        </button>
                    </div>
                </div>
            </div>

            <div id="monetization-ui-container"></div>

            <div id="notifications-ui-container"></div>

            <!-- PEOPLE_UI_SLOT -->

        <p class="text-sm font-bold text-gray-500">মেসেজ লোড হচ্ছে...</p>

                </div>
                <div id="emergency-list" class="space-y-3">
