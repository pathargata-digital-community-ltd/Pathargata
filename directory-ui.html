<!-- page-directory শুরু -->
<div id="page-directory" class="hidden p-4 bg-gray-50 min-h-screen pb-20">
    <div class="flex items-center justify-between mb-6">
        <div class="flex items-center gap-3">
            <button onclick="switchPage('services')" class="w-10 h-10 rounded-full bg-white flex items-center justify-center text-gray-600 hover:bg-gray-100 transition shadow-sm active:scale-95">
                <i class="fa-solid fa-arrow-left text-lg"></i>
            </button>
            <h2 class="text-xl font-bold border-l-4 border-green-600 pl-3 text-gray-800">ডিরেক্টরি ও জরুরি সেবা</h2>
        </div>
        <!-- বুকমার্ক করা কন্ট্যাক্ট দেখার বাটন -->
        <button onclick="toggleBookmarkView(true)" class="w-10 h-10 rounded-full bg-yellow-50 text-yellow-600 flex items-center justify-center shadow-sm active:scale-95 transition hover:bg-yellow-100" title="বুকমার্ক সমূহ">
            <i class="fa-solid fa-star text-lg"></i>
        </button>
    </div>

    <!-- প্রশাসনিক দপ্তর -->
    <h4 class="font-bold text-gray-400 text-xs mb-3 tracking-wider uppercase">প্রশাসনিক দপ্তর</h4>
    <div class="grid grid-cols-3 gap-3 mb-6">
        <div onclick="openDirectoryCategory('uno', 'ইউএনও অফিস')" class="bg-white p-4 rounded-2xl shadow-sm flex flex-col items-center justify-center cursor-pointer hover:shadow-md transition border border-gray-100 transform active:scale-95 duration-150">
            <div class="w-12 h-12 bg-blue-50 text-blue-600 rounded-full flex items-center justify-center text-xl mb-2">
                <i class="fa-solid fa-building-flag"></i>
            </div>
            <span class="text-xs font-bold text-gray-700 text-center leading-tight">ইউএনও</span>
        </div>
        <div onclick="openDirectoryCategory('acland', 'ভূমি অফিস')" class="bg-white p-4 rounded-2xl shadow-sm flex flex-col items-center justify-center cursor-pointer hover:shadow-md transition border border-gray-100 transform active:scale-95 duration-150">
            <div class="w-12 h-12 bg-emerald-50 text-emerald-600 rounded-full flex items-center justify-center text-xl mb-2">
                <i class="fa-solid fa-file-contract"></i>
            </div>
            <span class="text-xs font-bold text-gray-700 text-center leading-tight">ভূমি অফিস</span>
        </div>
        <div onclick="openDirectoryCategory('police', 'থানা পুলিশ')" class="bg-white p-4 rounded-2xl shadow-sm flex flex-col items-center justify-center cursor-pointer hover:shadow-md transition border border-gray-100 transform active:scale-95 duration-150">
            <div class="w-12 h-12 bg-indigo-50 text-indigo-600 rounded-full flex items-center justify-center text-xl mb-2">
                <i class="fa-solid fa-shield-halved"></i>
            </div>
            <span class="text-xs font-bold text-gray-700 text-center leading-tight">থানা</span>
        </div>
    </div>

    <!-- জরুরি সেবা -->
    <h4 class="font-bold text-gray-400 text-xs mb-3 tracking-wider uppercase">জরুরি সেবা</h4>
    <div class="grid grid-cols-3 gap-3 mb-6">
        <div onclick="openDirectoryCategory('health', 'উপজেলা স্বাস্থ্য কমপ্লেক্স')" class="bg-white p-4 rounded-2xl shadow-sm flex flex-col items-center justify-center cursor-pointer hover:shadow-md transition border border-gray-100 transform active:scale-95 duration-150">
            <div class="w-12 h-12 bg-red-50 text-red-600 rounded-full flex items-center justify-center text-xl mb-2">
                <i class="fa-solid fa-hospital animate-pulse"></i>
            </div>
            <span class="text-xs font-bold text-gray-700 text-center leading-tight">হাসপাতাল</span>
        </div>
        <div onclick="openDirectoryCategory('electricity', 'পল্লী বিদ্যুৎ')" class="bg-white p-4 rounded-2xl shadow-sm flex flex-col items-center justify-center cursor-pointer hover:shadow-md transition border border-gray-100 transform active:scale-95 duration-150">
            <div class="w-12 h-12 bg-amber-50 text-amber-600 rounded-full flex items-center justify-center text-xl mb-2">
                <i class="fa-solid fa-bolt"></i>
            </div>
            <span class="text-xs font-bold text-gray-700 text-center leading-tight">বিদ্যুৎ</span>
        </div>
        <div onclick="openDirectoryCategory('fire', 'ফায়ার সার্ভিস')" class="bg-white p-4 rounded-2xl shadow-sm flex flex-col items-center justify-center cursor-pointer hover:shadow-md transition border border-gray-100 transform active:scale-95 duration-150">
            <div class="w-12 h-12 bg-orange-50 text-orange-600 rounded-full flex items-center justify-center text-xl mb-2">
                <i class="fa-solid fa-fire-extinguisher"></i>
            </div>
            <span class="text-xs font-bold text-gray-700 text-center leading-tight">ফায়ার</span>
        </div>
    </div>

    <!-- অন্যান্য বিভাগ -->
    <h4 class="font-bold text-gray-400 text-xs mb-3 tracking-wider uppercase">অন্যান্য বিভাগ</h4>
    <div class="grid grid-cols-3 gap-3">
        <div onclick="openDirectoryCategory('doctor', 'ডাক্তারগণ')" class="bg-white p-4 rounded-2xl shadow-sm flex flex-col items-center justify-center cursor-pointer hover:shadow-md transition border border-gray-100 transform active:scale-95 duration-150">
            <div class="w-12 h-12 bg-sky-50 text-sky-600 rounded-full flex items-center justify-center text-xl mb-2">
                <i class="fa-solid fa-user-doctor"></i>
            </div>
            <span class="text-xs font-bold text-gray-700 text-center leading-tight">ডাক্তার</span>
        </div>
        <div onclick="openDirectoryCategory('ambulance', 'জরুরি অ্যাম্বুলেন্স')" class="bg-white p-4 rounded-2xl shadow-sm flex flex-col items-center justify-center cursor-pointer hover:shadow-md transition border border-gray-100 transform active:scale-95 duration-150">
            <div class="w-12 h-12 bg-rose-50 text-rose-600 rounded-full flex items-center justify-center text-xl mb-2">
                <i class="fa-solid fa-truck-medical"></i>
            </div>
            <span class="text-xs font-bold text-gray-700 text-center leading-tight">অ্যাম্বুলেন্স</span>
        </div>
        <div onclick="openDirectoryCategory('union', 'ইউনিয়ন পরিষদ')" class="bg-white p-4 rounded-2xl shadow-sm flex flex-col items-center justify-center cursor-pointer hover:shadow-md transition border border-gray-100 transform active:scale-95 duration-150">
            <div class="w-12 h-12 bg-teal-50 text-teal-600 rounded-full flex items-center justify-center text-xl mb-2">
                <i class="fa-solid fa-building-columns"></i>
            </div>
            <span class="text-xs font-bold text-gray-700 text-center leading-tight">ইউপি অফিস</span>
        </div>
    </div>
</div>

<!-- page-directory-list শুরু -->
<div id="page-directory-list" class="hidden p-4 bg-gray-50 min-h-screen pb-20">
    <div class="flex items-center gap-3 mb-4">
        <button onclick="goBackToDirectoryRoot()" class="w-10 h-10 rounded-full bg-white flex items-center justify-center text-gray-600 hover:bg-gray-100 transition shadow-sm active:scale-95">
            <i class="fa-solid fa-arrow-left text-lg"></i>
        </button>
        <h2 id="directory-list-title" class="text-xl font-bold text-gray-800">তালিকা</h2>
    </div>

    <!-- লাইভ সার্চ বার -->
    <div class="relative mb-5">
        <i class="fa-solid fa-magnifying-glass absolute left-4 top-3.5 text-gray-400"></i>
        <input type="text" id="directory-search-input" onkeyup="handleDirectoryLiveSearch(this.value)" placeholder="নাম বা পদবী দিয়ে খুঁজুন..." class="w-full bg-white border border-gray-200 py-3 pl-11 pr-4 rounded-2xl text-sm focus:outline-none focus:ring-2 focus:ring-green-500 shadow-sm transition">
    </div>

    <!-- ডাইনামিক কন্টাক্ট লিস্ট কন্টেইনার -->
    <div id="directory-items-container" class="space-y-3">
        <p class="text-center text-gray-400 mt-10">লোড হচ্ছে...</p>
    </div>
</div>

<!-- ৪. তথ্য সংশোধনের আবেদন মডাল (Suggest Edit Modal) -->
<div id="directory-suggest-modal" class="fixed inset-0 bg-black/50 z-[260] hidden flex items-center justify-center p-4 backdrop-blur-sm">
    <div class="bg-white w-full max-w-sm rounded-2xl p-6 shadow-2xl relative animate-fade">
        <button onclick="closeSuggestEditModal()" class="absolute top-4 right-4 text-gray-400 hover:text-red-500 transition"><i class="fa-solid fa-xmark text-xl"></i></button>
        <h3 class="text-lg font-bold text-gray-800 mb-2">তথ্য সংশোধনের অনুরোধ</h3>
        <p class="text-xs text-gray-500 mb-4">কোনো তথ্য ভুল থাকলে তা পরিবর্তন করার জন্য আবেদন করুন।</p>
        
        <input type="hidden" id="suggest-item-id">
        <input type="hidden" id="suggest-item-category">

        <div class="space-y-3">
            <div>
                <label class="text-xs font-bold text-gray-500 block mb-1">সঠিক নাম</label>
                <input type="text" id="suggest-name" class="w-full border p-2.5 rounded-xl text-sm bg-gray-50" placeholder="সঠিক নামটি লিখুন">
            </div>
            <div>
                <label class="text-xs font-bold text-gray-500 block mb-1">সঠিক মোবাইল নম্বর</label>
                <input type="tel" id="suggest-phone" class="w-full border p-2.5 rounded-xl text-sm bg-gray-50" placeholder="যেমন: 017XXXXXXXX">
            </div>
            <div>
                <label class="text-xs font-bold text-gray-500 block mb-1">অন্যান্য বিবরণ/ঠিকানা</label>
                <textarea id="suggest-details" rows="3" class="w-full border p-2.5 rounded-xl text-sm bg-gray-50" placeholder="ভুল সংশোধন সংক্রান্ত অতিরিক্ত বিবরণ..."></textarea>
            </div>
        </div>
        <button onclick="submitSuggestedEdit()" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-3 mt-5 rounded-xl shadow-lg transition active:scale-95">আবেদন পাঠান</button>
    </div>
</div>

<!-- ৫. রেটিং ও মতামত প্রদানের মডাল (Rating/Review Modal) -->
<div id="directory-rating-modal" class="fixed inset-0 bg-black/50 z-[260] hidden flex items-center justify-center p-4 backdrop-blur-sm">
    <div class="bg-white w-full max-w-sm rounded-2xl p-6 shadow-2xl relative animate-fade">
        <button onclick="closeDirectoryRatingModal()" class="absolute top-4 right-4 text-gray-400 hover:text-red-500 transition"><i class="fa-solid fa-xmark text-xl"></i></button>
        <h3 class="text-lg font-bold text-gray-800 mb-1">আপনার রেটিং দিন</h3>
        <p id="rating-item-name" class="text-xs text-green-600 font-bold mb-4">সেবাগ্রহীতার নাম...</p>

        <input type="hidden" id="rating-item-id">
        <input type="hidden" id="rating-item-category">

        <!-- স্টার সিলেকশন গ্রিড -->
        <div class="flex justify-center gap-2 mb-4">
            <span onclick="setRatingValue(1)" class="star-btn cursor-pointer text-gray-300 text-3xl transition" id="star-1"><i class="fa-solid fa-star"></i></span>
            <span onclick="setRatingValue(2)" class="star-btn cursor-pointer text-gray-300 text-3xl transition" id="star-2"><i class="fa-solid fa-star"></i></span>
            <span onclick="setRatingValue(3)" class="star-btn cursor-pointer text-gray-300 text-3xl transition" id="star-3"><i class="fa-solid fa-star"></i></span>
            <span onclick="setRatingValue(4)" class="star-btn cursor-pointer text-gray-300 text-3xl transition" id="star-4"><i class="fa-solid fa-star"></i></span>
            <span onclick="setRatingValue(5)" class="star-btn cursor-pointer text-gray-300 text-3xl transition" id="star-5"><i class="fa-solid fa-star"></i></span>
        </div>
        <input type="hidden" id="selected-star-val" value="0">

        <div>
            <label class="text-xs font-bold text-gray-500 block mb-1">মন্তব্য (ঐচ্ছিক)</label>
            <textarea id="rating-comment" rows="3" class="w-full border p-2.5 rounded-xl text-sm bg-gray-50" placeholder="আপনার অভিজ্ঞতা লিখুন..."></textarea>
        </div>

        <button onclick="submitDirectoryRating()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 mt-5 rounded-xl shadow-lg transition active:scale-95">রেটিং সাবমিট করুন</button>
    </div>
</div>
